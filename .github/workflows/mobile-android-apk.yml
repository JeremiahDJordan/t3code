name: Mobile Android APK

# Checks closed testing hourly. Each new beta gets one versioned prerelease.
# Unchanged checks publish nothing.
# Fork: automatic triggers are off until every workflow is audited (owner, 2026-10-17).
# Only manual runs and calls from another workflow remain; the originals are commented below.
on:
  workflow_dispatch:
  # Off for the fork:
  # schedule:
  #   # Avoid minute zero, when GitHub scheduled jobs are busiest.
  #   - cron: "23 * * * *"

concurrency:
  group: mobile-android-apk
  cancel-in-progress: false

jobs:
  mirror:
    name: Mirror beta APK
    # Fork: off (FORK.md, "Release channels the fork does not use"); drop `if: false` to turn it on.
    if: false
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      # Fork: APP_ID in packages/shared/src/forkIdentity.ts.
      PACKAGE_NAME: org.zanson.z6code
    steps:
      - id: credentials
        name: Check for Play credentials
        env:
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -n "$GOOGLE_PLAY_SERVICE_ACCOUNT_JSON" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "GOOGLE_PLAY_SERVICE_ACCOUNT_JSON is not available; skipping APK mirror."
          fi

      - name: Checkout
        if: steps.credentials.outputs.present == 'true'
        uses: actions/checkout@v6
        with:
          sparse-checkout: .github/scripts

      - name: Mirror the newest APK
        if: steps.credentials.outputs.present == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        run: node .github/scripts/mirror-play-apk.cjs
